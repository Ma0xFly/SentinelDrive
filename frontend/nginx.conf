server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # exportStatic 生成 /dashboard/、/user/login/ 等目录；目录重定向用相对
    # Location，避免把内部 3000 端口或反代外部主机写进跳转目标
    absolute_redirect off;

    # 静态资源带 hash，可长缓存；HTML 不缓存避免发布后过期
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/intelligence/:id 等路由找不到文件时回落 index.html
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}